<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad Integradora 1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <header class="cabecera">
        <h1 class="titulo">Lista de supermercado</h1>
        <p class="subtitulo">Agrega los productos que mas te gusten, marcalos como comprados y guarda.</p>
    </header>
    
    <main>
        <section class="contenedor" id="contenedor">
            <h2>Lista de la compra</h2>
            <form class="formulario"></form>
            <div>
                <label for="nombre-producto">Producto: </label>
                <input type="text"
                id="nombre-producto"
                class="input"
                placeholder="Ej: Leche"
                />
            </div>
            <div>
                <label for="cantidad-producto">Cantidad: </label>
                <input type="nunber"
                id="cantidad-producto"
                class="input"
                placeholder="1"
                />
            </div>
            <button type="submit" class="btn btn-primary" id="agregar">
                Agregar
            </button>

            <p id="mensaje" class="mensaje">Mensaje de prueba</p>

            <section class="contadores" id="contadores">
                <div class="contador">
                <span class="contador1">Total</span>
                <span id="contador-total">0</span>
                </div>
                 <div>
                 <span id="contador-comprados">Comprados</span>
                <span class="contador">0</span>
                </div>
                  <div>
                 <span id="contador-pendientes">Pendiente</span>
                <span class="contador">0</span>
                </div>
            </section>

            <section>
                <h3>Productos comprados</h3>
                <ul id="lista-productos" class="lista-productos"></ul>

                <button id="borrar" class="btn btn-primary" type="button">
                    Eliminar todo
                </button>
            </section>
        </section>
    </main>

    <footer class="footer">
        <p>Actividad Integradora # 1 - Lista de supermercado . Guardado con LocalStorage</p>
    </footer>
    <script src="scripts.js"></script>

</body>
</html>
